<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_tab" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#16121b;}body{overscroll-behavior:none;-webkit-font-smoothing:antialiased;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'on-secondary-fixed-variant': '#33495a', 'inverse-primary': '#934b00', 'secondary': '#b2c9de', 'primary': '#ffb782', 'outline-variant': '#544338', 'on-tertiary-fixed-variant': '#324d30', 'primary-container': '#e88a3c', 'surface-bright': '#3c3741', 'on-background': '#e9dfed', 'background': '#16121b', 'outline': '#a28c7f', 'surface-container-highest': '#38333d', 'on-surface': '#e9dfed', 'primary-fixed': '#ffdcc5', 'on-error': '#690005', 'on-tertiary-container': '#233e22', 'surface-container-lowest': '#100c15', 'surface-container-low': '#1e1a23', 'primary-fixed-dim': '#ffb782', 'error-container': '#93000a', 'on-primary-container': '#5a2b00', 'tertiary': '#afcfa9', 'surface-tint': '#ffb782', 'on-secondary-container': '#a4bbcf', 'secondary-fixed': '#cee5fa', 'on-error-container': '#ffdad6', 'on-secondary': '#1c3343', 'on-tertiary-fixed': '#062108', 'tertiary-fixed-dim': '#afcfa9', 'inverse-on-surface': '#332e38', 'on-secondary-fixed': '#041e2d', 'on-primary-fixed': '#301400', 'tertiary-container': '#8aa985', 'on-primary': '#4f2500', 'surface': '#16121b', 'on-surface-variant': '#dac2b2', 'inverse-surface': '#e9dfed', 'secondary-container': '#354c5c', 'tertiary-fixed': '#cbebc4', 'error': '#ffb4ab', 'surface-variant': '#38333d', 'secondary-fixed-dim': '#b2c9de', 'on-primary-fixed-variant': '#703800', 'surface-container-high': '#2d2832', 'on-tertiary': '#1c361c', 'surface-container': '#221e27', 'surface-dim': '#16121b' }, borderRadius: { 'DEFAULT': '0.125rem', 'lg': '0.25rem', 'xl': '0.5rem', 'full': '0.75rem' }, spacing: { 'space-sm': '0.5rem', 'space-md': '1rem', 'space-xl': '2rem', 'margin': '1rem', 'space-xs': '0.25rem', 'gutter': '1rem', 'space-lg': '1.5rem' }, fontFamily: { 'readout-secondary': ['JetBrains Mono'], 'label-micro': ['Barlow Condensed'], 'body-default': ['Barlow Condensed'], 'button-text': ['Barlow Condensed'], 'panel-title': ['Barlow Condensed'], 'display-numeric': ['JetBrains Mono'], 'label-caps': ['Barlow Condensed'], 'readout-micro': ['JetBrains Mono'] }, fontSize: { 'readout-secondary': ['16px', { lineHeight: '20px', letterSpacing: '0em', fontWeight: '500' }], 'label-micro': ['11px', { lineHeight: '14px', letterSpacing: '0.08em', fontWeight: '600' }], 'body-default': ['15px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '400' }], 'button-text': ['13px', { lineHeight: '16px', letterSpacing: '0.06em', fontWeight: '700' }], 'panel-title': ['20px', { lineHeight: '24px', letterSpacing: '0.02em', fontWeight: '600' }], 'display-numeric': ['40px', { lineHeight: '44px', letterSpacing: '-0.02em', fontWeight: '600' }], 'label-caps': ['12px', { lineHeight: '16px', letterSpacing: '0.08em', fontWeight: '600' }], 'readout-micro': ['12px', { lineHeight: '16px', letterSpacing: '0em', fontWeight: '500' }] } } } };</script></head><body class="bg-surface font-body-default text-body-default text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-12 px-gutter flex items-center justify-between border-b border-[#3A3342] bg-[#141019]"><span class="font-panel-title text-[18px] text-[#EDE8E3] font-semibold tracking-wide">Packing Conveyor</span><div class="flex items-center gap-3"><div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-[1px] bg-[#8FAE8A]"></span><span class="font-readout-micro text-[11px] text-[#8FAE8A] uppercase tracking-wider font-medium">Connected</span></div><span class="material-symbols-outlined text-[18px] text-[#dac2b2] cursor-pointer hover:text-primary transition-colors">settings</span></div></div></header><main class="flex flex-col relative w-full pt-14 pb-20 bg-surface"><div class="flex flex-col w-full px-4 pt-12 pb-16 gap-2.5 max-w-md mx-auto select-none bg-[#141019]">
  <!-- State Row between two hairlines -->
  <div class="flex items-center gap-2 py-1.5 border-y border-[#3A3342]">
    <span class="w-2 h-2 rounded-[1px] bg-[#8FAE8A]"></span>
    <span class="font-panel-title text-[15px] font-semibold text-[#EDE8E3] tracking-wide">Belt running</span>
  </div>

  <!-- Readout Table (4 rows) -->
  <div class="flex flex-col bg-[#1D1823] border border-[#3A3342] rounded-[2px] divide-y divide-[#3A3342]">
    <div class="flex items-center justify-between px-3 py-1.5">
      <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">ROLLER SPEED</span>
      <span class="font-readout-secondary text-[14px] text-[#EDE8E3] tabular-nums font-medium"><span id="speed-encoder-val" class="">144.0</span> RPM</span>
    </div>
    <div class="flex items-center justify-between px-3 py-1.5">
      <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">BELT SETTING</span>
      <span class="font-readout-secondary text-[14px] text-[#E88A3C] tabular-nums font-medium"><span id="belt-setting-val" class="">65</span> %</span>
    </div>
    <div class="flex items-center justify-between px-3 py-1.5">
      <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">BOXES MOVED</span>
      <span class="font-readout-secondary text-[14px] text-[#EDE8E3] tabular-nums font-medium" id="boxes-moved-val">34</span>
    </div>
    <div class="flex items-center justify-between px-3 py-1.5">
      <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">LARGE BOXES FILLED</span>
      <span class="font-readout-secondary text-[14px] text-[#EDE8E3] tabular-nums font-medium">3</span>
    </div>
  </div>

  <!-- Current Large Box Panel between hairlines -->
  <div class="flex flex-col bg-[#1D1823] border border-[#3A3342] rounded-[2px] p-2.5 gap-2">
    <div class="flex items-center justify-between">
      <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">CURRENT LARGE BOX</span>
      <span class="font-readout-secondary text-[13px] text-[#EDE8E3] tabular-nums font-medium">4 / 10</span>
    </div>
    <!-- 10 Flat Rectangular Cells: 4 filled off-white, 6 empty with hairline outline -->
    <div class="grid grid-cols-10 gap-1 h-2.5 w-full">
      <div class="bg-[#EDE8E3] rounded-[2px] h-full"></div>
      <div class="bg-[#EDE8E3] rounded-[2px] h-full"></div>
      <div class="bg-[#EDE8E3] rounded-[2px] h-full"></div>
      <div class="bg-[#EDE8E3] rounded-[2px] h-full"></div>
      <div class="border border-[#3A3342] rounded-[2px] h-full"></div>
      <div class="border border-[#3A3342] rounded-[2px] h-full"></div>
      <div class="border border-[#3A3342] rounded-[2px] h-full"></div>
      <div class="border border-[#3A3342] rounded-[2px] h-full"></div>
      <div class="border border-[#3A3342] rounded-[2px] h-full"></div>
      <div class="border border-[#3A3342] rounded-[2px] h-full"></div>
    </div>
  </div>

  <!-- Start & Stop Buttons Side by Side -->
  <div class="grid grid-cols-2 gap-2">
    <button id="btn-start" class="h-10 bg-[#E88A3C] text-[#141019] font-button-text text-[13px] uppercase tracking-wider font-bold rounded-[4px] flex items-center justify-center transition-opacity active:opacity-80">
      Start
    </button>
    <button id="btn-stop" class="h-10 bg-transparent border border-[#3A3342] text-[#EDE8E3] font-button-text text-[13px] uppercase tracking-wider font-semibold rounded-[4px] flex items-center justify-center transition-colors hover:border-[#EDE8E3] active:bg-[#3A3342]/20">
      Stop
    </button>
  </div>

  <!-- Speed Control Panel -->
  <div class="flex flex-col bg-[#1D1823] border border-[#3A3342] rounded-[2px] p-2.5 gap-1.5">
    <div class="flex items-center justify-between">
      <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">SPEED</span>
      <div class="font-display-numeric text-[32px] leading-none text-[#EDE8E3] tracking-tight tabular-nums">
        <span id="speed-display" class="">65</span><span class="text-[18px] text-[#E88A3C] font-normal ml-0.5">%</span>
      </div>
    </div>
    <div class="relative w-full py-1">
      <input id="speed-slider" type="range" min="20" max="100" step="1" value="65" class="w-full h-1 bg-[#3A3342] rounded appearance-none cursor-pointer accent-[#E88A3C] focus:outline-none">
      <div class="flex justify-between text-[10px] font-readout-micro text-[#a28c7f] pt-1">
        <span class="cursor-pointer hover:text-[#EDE8E3]" onclick="updateSpeed(20)">20</span>
        <span class="cursor-pointer hover:text-[#EDE8E3]" onclick="updateSpeed(40)">40</span>
        <span class="cursor-pointer hover:text-[#EDE8E3]" onclick="updateSpeed(60)">60</span>
        <span class="cursor-pointer hover:text-[#EDE8E3]" onclick="updateSpeed(80)">80</span>
        <span class="cursor-pointer hover:text-[#EDE8E3]" onclick="updateSpeed(100)">100</span>
      </div>
    </div>
  </div>

  <!-- Utility Actions: Clear fault and Refresh (Outlined) -->
  <div class="grid grid-cols-2 gap-2">
    <button id="btn-clear-fault" class="h-8 border border-[#3A3342] text-[#EDE8E3] font-button-text text-[11px] uppercase tracking-wider rounded-[2px] flex items-center justify-center hover:border-[#EDE8E3] transition-colors">
      Clear fault
    </button>
    <button id="btn-refresh" class="h-8 border border-[#3A3342] text-[#EDE8E3] font-button-text text-[11px] uppercase tracking-wider rounded-[2px] flex items-center justify-center hover:border-[#EDE8E3] transition-colors">
      Refresh
    </button>
  </div>

  <!-- Footer: Auto Refresh with Minimal Switch -->
  <div class="flex items-center justify-between pt-1 border-t border-[#3A3342]">
    <span class="font-panel-title text-[12px] uppercase text-[#dac2b2] tracking-[0.08em] font-medium">Auto refresh</span>
    <label class="relative inline-flex items-center cursor-pointer">
      <input id="auto-refresh-toggle" type="checkbox" checked="" class="sr-only peer">
      <div class="w-8 h-4 bg-[#3A3342] peer-focus:outline-none rounded-full peer peer-checked:bg-[#E88A3C] transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-[#EDE8E3] after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4"></div>
    </label>
  </div>
</div>

<script>
  function updateSpeed(val) {
    const slider = document.getElementById('speed-slider');
    const display = document.getElementById('speed-display');
    const beltSetting = document.getElementById('belt-setting-val');
    const encoder = document.getElementById('speed-encoder-val');
    if (slider) slider.value = val;
    if (display) display.textContent = val;
    if (beltSetting) beltSetting.textContent = val;
    if (encoder) {
      encoder.textContent = (val * 2.2154).toFixed(1);
    }
  }
  const slider = document.getElementById('speed-slider');
  if (slider) {
    slider.addEventListener('input', (e) => updateSpeed(e.target.value));
  }
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl" data-active-classes="bg-surface-container-high text-primary font-bold"><div class="flex justify-around items-center h-12 px-space-xs border-t border-[#3A3342] bg-[#141019]"><a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 px-3 py-1 rounded-[2px] text-[#E88A3C] font-bold" data-path="dashboard" href="#"><span class="material-symbols-outlined text-[18px]">tune</span><span class="font-label-caps text-[10px] uppercase tracking-wider">Telemet</span></a><a class="flex flex-col items-center justify-center gap-0.5 px-3 py-1 rounded-[2px] text-[#dac2b2] hover:text-[#EDE8E3] transition-colors" data-path="dashboard-states" href="#"><span class="material-symbols-outlined text-[18px]">sensors</span><span class="font-label-caps text-[10px] uppercase tracking-wider">States</span></a><a class="flex flex-col items-center justify-center gap-0.5 px-3 py-1 rounded-[2px] text-[#dac2b2] hover:text-[#EDE8E3] transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined text-[18px]">settings_input_component</span><span class="font-label-caps text-[10px] uppercase tracking-wider">Config</span></a></div></nav>

</body></html>
