<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#16121b;}body{overscroll-behavior:none;-webkit-font-smoothing:antialiased;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'on-secondary-fixed-variant': '#33495a', 'inverse-primary': '#934b00', 'secondary': '#b2c9de', 'primary': '#ffb782', 'outline-variant': '#544338', 'on-tertiary-fixed-variant': '#324d30', 'primary-container': '#e88a3c', 'surface-bright': '#3c3741', 'on-background': '#e9dfed', 'background': '#16121b', 'outline': '#a28c7f', 'surface-container-highest': '#38333d', 'on-surface': '#e9dfed', 'primary-fixed': '#ffdcc5', 'on-error': '#690005', 'on-tertiary-container': '#233e22', 'surface-container-lowest': '#100c15', 'surface-container-low': '#1e1a23', 'primary-fixed-dim': '#ffb782', 'error-container': '#93000a', 'on-primary-container': '#5a2b00', 'tertiary': '#afcfa9', 'surface-tint': '#ffb782', 'on-secondary-container': '#a4bbcf', 'secondary-fixed': '#cee5fa', 'on-error-container': '#ffdad6', 'on-secondary': '#1c3343', 'on-tertiary-fixed': '#062108', 'tertiary-fixed-dim': '#afcfa9', 'inverse-on-surface': '#332e38', 'on-secondary-fixed': '#041e2d', 'on-primary-fixed': '#301400', 'tertiary-container': '#8aa985', 'on-primary': '#4f2500', 'surface': '#16121b', 'on-surface-variant': '#dac2b2', 'inverse-surface': '#e9dfed', 'secondary-container': '#354c5c', 'tertiary-fixed': '#cbebc4', 'error': '#ffb4ab', 'surface-variant': '#38333d', 'secondary-fixed-dim': '#b2c9de', 'on-primary-fixed-variant': '#703800', 'surface-container-high': '#2d2832', 'on-tertiary': '#1c361c', 'surface-container': '#221e27', 'surface-dim': '#16121b' }, borderRadius: { 'DEFAULT': '0.125rem', 'lg': '0.25rem', 'xl': '0.5rem', 'full': '0.75rem' }, spacing: { 'space-sm': '0.5rem', 'space-md': '1rem', 'space-xl': '2rem', 'margin': '1rem', 'space-xs': '0.25rem', 'gutter': '1rem', 'space-lg': '1.5rem' }, fontFamily: { 'readout-secondary': ['JetBrains Mono'], 'label-micro': ['Barlow Condensed'], 'body-default': ['Barlow Condensed'], 'button-text': ['Barlow Condensed'], 'panel-title': ['Barlow Condensed'], 'display-numeric': ['JetBrains Mono'], 'label-caps': ['Barlow Condensed'], 'readout-micro': ['JetBrains Mono'] }, fontSize: { 'readout-secondary': ['16px', { lineHeight: '20px', letterSpacing: '0em', fontWeight: '500' }], 'label-micro': ['11px', { lineHeight: '14px', letterSpacing: '0.08em', fontWeight: '600' }], 'body-default': ['15px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '400' }], 'button-text': ['13px', { lineHeight: '16px', letterSpacing: '0.06em', fontWeight: '700' }], 'panel-title': ['20px', { lineHeight: '24px', letterSpacing: '0.02em', fontWeight: '600' }], 'display-numeric': ['40px', { lineHeight: '44px', letterSpacing: '-0.02em', fontWeight: '600' }], 'label-caps': ['12px', { lineHeight: '16px', letterSpacing: '0.08em', fontWeight: '600' }], 'readout-micro': ['12px', { lineHeight: '16px', letterSpacing: '0em', fontWeight: '500' }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-default text-body-default text-on-surface pt-safe pb-safe min-h-screen flex flex-col"><main class="flex flex-col relative w-full flex-1 bg-surface"><div class="flex flex-col w-full p-4 space-y-4 select-none">
<!-- Top Hardware Rack Header Bay -->
<div class="bg-surface-container-low border border-[#3A3342] rounded-lg p-3 flex flex-col space-y-2">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-none bg-[#8A8494] inline-block"></span>
<span class="font-label-micro text-label-micro uppercase text-on-surface-variant tracking-wider" id="conn-status-text">NOT CONNECTED</span>
</div>
<span class="font-readout-micro text-readout-micro text-outline tracking-tight">PORT // 8080</span>
</div>
<div class="h-[1px] w-full bg-[#3A3342]"></div>
<div class="flex items-baseline justify-between pt-0.5">
<h1 class="font-panel-title text-panel-title text-on-surface tracking-wide">Packing Conveyor</h1>
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">ESP32-S3 CORE</span>
</div>
</div>
<!-- Bench Instrument Bay: Address Input -->
<div class="bg-surface-container-low border border-[#3A3342] rounded-lg overflow-hidden">
<!-- Sub-rack Header Tag -->
<div class="bg-surface-container px-3 py-2 border-b border-[#3A3342] flex items-center justify-between">
<span class="font-label-micro text-label-micro uppercase text-on-surface-variant tracking-widest">ESP32 IP ADDRESS</span>
<span class="font-readout-micro text-readout-micro text-outline">NET_OCTET</span>
</div>
<!-- Recessed Data Well Display / Entry Field -->
<div class="p-4 space-y-3">
<div class="relative bg-surface-container-lowest border border-[#3A3342] rounded-lg px-3 py-3 flex items-center focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined text-outline text-[18px] mr-2">lan</span>
<input autocomplete="off" class="w-full bg-transparent font-readout-secondary text-readout-secondary text-on-surface placeholder:text-outline-variant focus:outline-none tracking-wider" id="ip-input" placeholder="192.168.1.50" spellcheck="false" type="text" value=""/>
<div class="w-2 h-4 bg-primary-container ml-1 animate-pulse" id="cursor-indicator"></div>
</div>
<!-- Action Button -->
<button class="w-full h-11 bg-primary-container active:bg-[#f2994e] text-on-primary-container font-button-text text-button-text uppercase tracking-widest rounded-lg flex items-center justify-center space-x-1.5 transition-colors border border-primary-container active:translate-y-[1px]" id="btn-connect">
<span class="material-symbols-outlined text-[18px]">power_settings_new</span>
<span id="btn-label">CONNECT</span>
</button>
<!-- OLED Guidance Link -->
<div class="flex justify-center pt-1">
<button class="font-label-caps text-label-caps text-primary hover:text-primary-fixed tracking-wider underline underline-offset-4 uppercase inline-flex items-center space-x-1 py-1" id="btn-oled-sync" type="button">
<span class="material-symbols-outlined text-[14px]">visibility</span>
<span>Use address shown on OLED</span>
</button>
</div>
</div>
</div>
<!-- Recent Address Buffer Instrument Card -->
<div class="bg-surface-container-low border border-[#3A3342] rounded-lg overflow-hidden">
<div class="bg-surface-container px-3 py-2 border-b border-[#3A3342] flex items-center justify-between">
<span class="font-label-micro text-label-micro uppercase text-on-surface-variant tracking-widest">RECENT ADDRESS</span>
<span class="font-readout-micro text-readout-micro text-outline">NV_MEM:01</span>
</div>
<button class="w-full p-3 flex items-center justify-between bg-surface-container-lowest hover:bg-surface-container border-t border-[#3A3342] first:border-t-0 text-left transition-colors group" id="btn-recent-fill" type="button">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-outline text-[16px] group-hover:text-primary transition-colors">history</span>
<span class="font-readout-secondary text-readout-secondary text-on-surface">192.168.1.50</span>
</div>
<span class="bg-surface-container border border-[#3A3342] group-hover:border-primary-container text-outline group-hover:text-primary-container font-label-micro text-label-micro px-2 py-0.5 rounded uppercase tracking-wider">
        TAP TO FILL
      </span>
</button>
</div>
<!-- Diagnostic Telemetry Readout Grid -->
<div class="grid grid-cols-2 gap-2">
<div class="bg-surface-container-low border border-[#3A3342] p-2.5 rounded-lg flex flex-col justify-between">
<span class="font-label-micro text-label-micro text-on-surface-variant uppercase tracking-wider">WIFI BUS</span>
<div class="flex items-baseline space-x-1 mt-1">
<span class="font-readout-secondary text-readout-secondary text-on-surface">2.4</span>
<span class="font-label-micro text-label-micro text-outline">GHZ / CH6</span>
</div>
</div>
<div class="bg-surface-container-low border border-[#3A3342] p-2.5 rounded-lg flex flex-col justify-between">
<span class="font-label-micro text-label-micro text-on-surface-variant uppercase tracking-wider">CONVEYOR ID</span>
<div class="flex items-baseline space-x-1 mt-1">
<span class="font-readout-secondary text-readout-secondary text-on-surface">CV-04</span>
<span class="font-label-micro text-label-micro text-outline">STATION B</span>
</div>
</div>
</div>
<!-- Instruction Notice Bay -->
<div class="bg-surface-container-low border border-[#3A3342] rounded-lg p-3 flex items-start space-x-2.5">
<span class="material-symbols-outlined text-outline text-[18px] shrink-0 mt-0.5">info</span>
<p class="font-label-caps text-label-caps text-on-surface-variant leading-tight">
      Read the IP address from the conveyor OLED screen. Ensure handheld terminal is routed through the factory AP subnet.
    </p>
</div>
</div>
<script>
  (function () {
    const input = document.getElementById('ip-input');
    const recentBtn = document.getElementById('btn-recent-fill');
    const oledBtn = document.getElementById('btn-oled-sync');
    const connectBtn = document.getElementById('btn-connect');
    const label = document.getElementById('btn-label');
    const statusText = document.getElementById('conn-status-text');
    const statusMarker = statusText?.previousElementSibling;
    const cursor = document.getElementById('cursor-indicator');

    const fillAddress = (val) => {
      if (!input) return;
      input.value = val;
      input.focus();
      if (cursor) cursor.classList.add('hidden');
    };

    recentBtn?.addEventListener('click', () => fillAddress('192.168.1.50'));
    oledBtn?.addEventListener('click', () => fillAddress('192.168.1.50'));

    input?.addEventListener('input', () => {
      if (cursor) {
        cursor.classList.toggle('hidden', input.value.length > 0);
      }
    });

    let connecting = false;
    connectBtn?.addEventListener('click', () => {
      if (connecting) return;
      const targetIp = input?.value.trim() || '192.168.1.50';
      connecting = true;
      if (label) label.textContent = 'CONNECTING...';
      if (statusText) statusText.textContent = 'POLLING BUS';
      if (statusMarker) {
        statusMarker.className = 'w-2 h-2 rounded-none bg-primary-container inline-block animate-ping';
      }

      setTimeout(() => {
        connecting = false;
        if (label) label.textContent = 'ONLINE';
        if (statusText) {
          statusText.textContent = 'ONLINE // ' + targetIp;
          statusText.classList.remove('text-on-surface-variant');
          statusText.classList.add('text-tertiary');
        }
        if (statusMarker) {
          statusMarker.className = 'w-2 h-2 rounded-none bg-tertiary inline-block';
        }
        connectBtn.classList.remove('bg-primary-container', 'border-primary-container');
        connectBtn.classList.add('bg-tertiary-container', 'border-tertiary-container', 'text-on-tertiary-container');
      }, 1200);
    });
  })();
</script></main></body></html>
